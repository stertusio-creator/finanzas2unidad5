    // Métodos de navegación
    navigate: function(viewId) {
        this.state.currentView = viewId;
        this.render();
    },

    toggleTheme: function() {
        const html = document.documentElement;
        const iconSun = document.getElementById('theme-icon-sun');
        const iconMoon = document.getElementById('theme-icon-moon');
        
        if (this.state.theme === 'light') {
            html.classList.add('dark');
            html.classList.remove('light');
            this.state.theme = 'dark';
        } else {
            html.classList.remove('dark');
            html.classList.add('light');
            this.state.theme = 'light';
        }
    },

    // Métodos del Quiz
    startQuiz: function() {
        // Reinicio de estado
        this.state.quiz.currentQuestionIndex = 0;
        this.state.quiz.score = 0;
        this.state.quiz.answers = [];
        this.state.quiz.isFinished = false;
        // Shuffle (opcional, pero pedido)
        this.quizData = this.shuffleArray([...this.quizData]);
        this.navigate('quiz');
    },

    shuffleArray: function(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    },

    selectAnswer: function(optionIndex) {
        // Prevenir doble click si ya se respondió
        if (this.state.quiz.answers[this.state.quiz.currentQuestionIndex] !== undefined) return;

        const currentQ = this.quizData[this.state.quiz.currentQuestionIndex];
        const isCorrect = optionIndex === currentQ.correctIndex;

        if (isCorrect) {
            this.state.quiz.score++;
        }

        this.state.quiz.answers[this.state.quiz.currentQuestionIndex] = {
            selected: optionIndex,
            isCorrect: isCorrect
        };

        this.renderQuizView(); // Re-render para mostrar feedback
    },

    nextQuestion: function() {
        if (this.state.quiz.currentQuestionIndex < this.quizData.length - 1) {
            this.state.quiz.currentQuestionIndex++;
            this.renderQuizView();
        } else {
            this.state.quiz.isFinished = true;
            this.renderQuizResults();
        }
    },

    // -----------------------------------------------------
    // SISTEMA DE RENDERIZADO
    // -----------------------------------------------------
    render: function() {
        const mainContent = document.getElementById('main-content');
        mainContent.innerHTML = ''; // Limpiar

        if (this.state.currentView === 'home') {
            mainContent.innerHTML = this.templateHome();
        } else if (this.state.currentView === 'theory') {
            mainContent.innerHTML = this.templateTheory();
        } else if (this.state.currentView === 'quiz') {
            if (this.state.quiz.isFinished) {
                mainContent.innerHTML = this.templateQuizResults();
            } else {
                mainContent.innerHTML = this.templateQuiz();
            }
        }
    },

    // --- TEMPLATES HTML ---
    
    templateHome: function() {
        return `
            <div class="flex-grow flex flex-col items-center justify-center text-center fade-in">
                <div class="max-w-2xl bg-white dark:bg-dark-card rounded-2xl shadow-xl p-8 sm:p-12 border border-gray-100 dark:border-gray-800">
                    <div class="w-20 h-20 mx-auto bg-primary-100 text-primary-600 dark:bg-primary-900/50 dark:text-primary-400 rounded-full flex items-center justify-center mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18L9 11.25l4.306 4.307a11.95 11.95 0 015.814-5.519l2.74-1.22m0 0l-5.94-2.28m5.94 2.28l-2.28 5.941" />
                        </svg>
                    </div>
                    <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-4">Instrumentos Derivados</h2>
                    <p class="text-lg text-gray-600 dark:text-gray-300 mb-8 leading-relaxed">
                        Domina los conceptos clave sobre Futuros, Forwards, Opciones y Swaps. Este módulo interactivo combina microaprendizaje teórico con evaluación formativa.
                    </p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="app.navigate('theory')" class="px-6 py-3 rounded-xl font-semibold text-white bg-primary-600 hover:bg-primary-700 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            Aspectos Teóricos
                        </button>
                        <button onclick="app.startQuiz()" class="px-6 py-3 rounded-xl font-semibold text-gray-900 bg-white border-2 border-gray-200 hover:border-primary-500 hover:text-primary-600 dark:bg-dark-card dark:text-gray-100 dark:border-gray-600 dark:hover:border-primary-400 dark:hover:text-primary-400 shadow-sm transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                            Quizz Interactivo
                        </button>
                    </div>
                </div>
            </div>
        `;
    },

    templateTheory: function() {
        let cardsHtml = this.theoryData.map((item, index) => `
            <div class="bg-white dark:bg-dark-card rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-800 hover:shadow-md transition-shadow">
                <div class="text-primary-500 dark:text-primary-400 mb-4 bg-primary-50 dark:bg-primary-900/30 inline-block p-3 rounded-lg">
                    ${item.icon}
                </div>
                <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-3 leading-tight">${item.title}</h3>
                <p class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed">${item.content}</p>
            </div>
        `).join('');

        return `
            <div class="fade-in">
                <div class="mb-8 text-center sm:text-left">
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">10 Conceptos Clave</h2>
                    <p class="text-gray-500 dark:text-gray-400 mt-2">Revisa estos aspectos esenciales antes de poner a prueba tus conocimientos.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${cardsHtml}
                </div>
                <div class="mt-12 text-center">
                    <button onclick="app.startQuiz()" class="px-8 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-primary-600 to-blue-500 hover:from-primary-700 hover:to-blue-600 shadow-lg transform hover:-translate-y-1 transition-all">
                        ¡Ir al Quizz!
                    </button>
                </div>
            </div>
        `;
    },

    templateQuiz: function() {
        const qIndex = this.state.quiz.currentQuestionIndex;
        const question = this.quizData[qIndex];
        const answerData = this.state.quiz.answers[qIndex];
        const isAnswered = answerData !== undefined;

        let optionsHtml = question.options.map((opt, index) => {
            let btnClass = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center gap-3 ";
            let iconHtml = `<div class="w-6 h-6 rounded-full border-2 border-gray-300 flex-shrink-0"></div>`; // Default empty circle

            if (!isAnswered) {
                // Estado Normal
                btnClass += "border-gray-200 dark:border-gray-700 hover:border-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 dark:text-gray-200";
            } else {
                // Estado Respondido
                btnClass += "cursor-default ";
                if (index === question.correctIndex) {
                    // Es la correcta
                    btnClass += "border-green-500 bg-green-50 dark:bg-green-900/20 text-green-800 dark:text-green-200 font-medium";
                    iconHtml = `<svg class="w-6 h-6 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
                } else if (index === answerData.selected) {
                    // Seleccionada pero incorrecta
                    btnClass += "border-red-500 bg-red-50 dark:bg-red-900/20 text-red-800 dark:text-red-200";
                    iconHtml = `<svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
                } else {
                    // Otras opciones
                    btnClass += "border-gray-200 dark:border-gray-700 opacity-50 dark:text-gray-400";
                }
            }

            return `
                <button onclick="app.selectAnswer(${index})" class="${btnClass}" ${isAnswered ? 'disabled' : ''}>
                    ${iconHtml}
                    <span class="flex-grow">${opt}</span>
                </button>
            `;
        }).join('');

        let feedbackHtml = '';
        if (isAnswered) {
            const feedbackColor = answerData.isCorrect ? 'bg-green-100 border-green-300 text-green-800 dark:bg-green-900/40 dark:border-green-800 dark:text-green-200' : 'bg-red-100 border-red-300 text-red-800 dark:bg-red-900/40 dark:border-red-800 dark:text-red-200';
            const feedbackText = answerData.isCorrect ? question.feedbackCorrect : question.feedbackIncorrect;
            
            feedbackHtml = `
                <div class="mt-6 p-5 rounded-xl border ${feedbackColor} animate-[fadeIn_0.3s_ease-out]">
                    <p class="font-bold mb-2 flex items-center gap-2">
                        ${answerData.isCorrect ? '✓ Respuesta Correcta' : '✗ Respuesta Incorrecta'}
                    </p>
                    <p class="mb-3 text-sm sm:text-base">${feedbackText}</p>
                    <div class="mt-4 pt-4 border-t border-current opacity-80 text-sm">
                        <p class="font-semibold mb-1 flex items-center gap-1">
                           <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                           Fundamentación Técnica:
                        </p>
                        <p>${question.rationale}</p>
                    </div>
                </div>
            `;
        }

        // Progress bar
        const progressPercent = ((qIndex) / this.quizData.length) * 100;

        return `
            <div class="max-w-3xl mx-auto w-full fade-in pb-12">
                <!-- Header Quizz -->
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-semibold text-gray-500 dark:text-gray-400">Pregunta ${qIndex + 1} de ${this.quizData.length}</span>
                    <span class="text-sm font-bold text-primary-600 dark:text-primary-400">Puntaje: ${this.state.quiz.score}</span>
                </div>
                <!-- Barra Progreso -->
                <div class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full mb-8 overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary-500 to-blue-500 transition-all duration-300" style="width: ${progressPercent}%"></div>
                </div>

                <!-- Pregunta -->
                <div class="bg-white dark:bg-dark-card rounded-2xl p-6 sm:p-8 shadow-md border border-gray-100 dark:border-gray-800">
                    <h3 class="text-xl sm:text-2xl font-bold text-gray-900 dark:text-white mb-6">${question.question}</h3>
                    
                    <div class="flex flex-col gap-3">
                        ${optionsHtml}
                    </div>

                    ${feedbackHtml}

                    <div class="mt-8 flex justify-end">
                        <button onclick="app.nextQuestion()" class="px-6 py-2 rounded-lg font-bold text-white bg-gray-800 hover:bg-gray-900 dark:bg-primary-600 dark:hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors" ${!isAnswered ? 'disabled' : ''}>
                            ${qIndex === this.quizData.length - 1 ? 'Finalizar Quizz' : 'Siguiente Pregunta ➔'}
                        </button>
                    </div>
                </div>
            </div>
        `;
    },

    templateQuizResults: function() {
        const total = this.quizData.length;
        const score = this.state.quiz.score;
        const percentage = Math.round((score / total) * 100);
        
        let message = "";
        let colorClass = "";
        
        if (percentage >= 90) {
            message = "¡Excelente! Nivel Experto en Derivados.";
            colorClass = "text-green-500";
        } else if (percentage >= 70) {
            message = "¡Muy bien! Tienes un buen dominio de los conceptos.";
            colorClass = "text-blue-500";
        } else if (percentage >= 50) {
            message = "Aprobado. Te sugerimos repasar algunos aspectos teóricos.";
            colorClass = "text-yellow-500";
        } else {
            message = "Necesitas repasar. Vuelve a la sección teórica e inténtalo de nuevo.";
            colorClass = "text-red-500";
        }

        return `
            <div class="flex-grow flex flex-col items-center justify-center text-center fade-in">
                <div class="max-w-xl w-full bg-white dark:bg-dark-card rounded-2xl shadow-xl p-8 sm:p-12 border border-gray-100 dark:border-gray-800">
                    
                    <div class="relative w-32 h-32 mx-auto mb-6">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                            <path class="text-gray-200 dark:text-gray-700" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path class="${colorClass} transition-all duration-1000 ease-out" stroke-dasharray="${percentage}, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div class="absolute inset-0 flex items-center justify-center flex-col">
                            <span class="text-3xl font-bold ${colorClass}">${percentage}%</span>
                        </div>
                    </div>

                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Resultados Finales</h2>
                    <p class="text-lg text-gray-600 dark:text-gray-300 mb-2">Acertaste <strong>${score}</strong> de <strong>${total}</strong> preguntas.</p>
                    <p class="font-medium ${colorClass} mb-8">${message}</p>
                    
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="app.startQuiz()" class="px-6 py-2 rounded-xl font-semibold text-white bg-primary-600 hover:bg-primary-700 transition-colors flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Reintentar Quizz
                        </button>
                        <button onclick="app.navigate('theory')" class="px-6 py-2 rounded-xl font-semibold text-primary-700 bg-primary-100 hover:bg-primary-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition-colors">
                            Repasar Teoría
                        </button>
                    </div>
                </div>
            </div>
        `;
    },

    // Auxiliar para re-renderizar solo la vista de quiz sin parpadeos drásticos
    renderQuizView: function() {
        const mainContent = document.getElementById('main-content');
        if(this.state.currentView === 'quiz' && !this.state.quiz.isFinished) {
            mainContent.innerHTML = this.templateQuiz();
        }
    }
};

// Inicialización
window.onload = () => {
    // Detectar preferencia de tema del sistema
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        app.state.theme = 'light'; // Forzamos light para que el toggle lo cambie a dark correctamente inicializando UI
        app.toggleTheme();
    }
    app.render();
};
</script>
</body>
</html>
